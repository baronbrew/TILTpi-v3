# Builds the two Tilt Pi SD card images with pi-gen:
#   tiltpi-desktop-arm64  Raspberry Pi OS with desktop, 64-bit (Pi 3 and newer) + Chromium kiosk
#   tiltpi-lite-armhf     Raspberry Pi OS Lite, 32-bit (Pi Zero W and newer) + Tkinter/Chromium display
# Runs on version tags (v*) and on demand. Tagged builds attach the images to the GitHub release.
name: Build SD card images

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: tiltpi-desktop-arm64
            pi-gen-version: arm64
            stage-list: stage0 stage1 stage2 stage3 stage4 ./image/stage-tiltpi
          - name: tiltpi-lite-armhf
            pi-gen-version: master
            stage-list: stage0 stage1 stage2 ./image/stage-tiltpi
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Free disk space (pi-gen needs ~15 GB)
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift \
            /usr/local/share/powershell /usr/local/share/chromium /usr/lib/jvm || true
          sudo docker image prune --all --force || true
          df -h /

      # pi-gen master builds armhf inside an i386 Debian container. Build that container here
      # first (same Dockerfile, so pi-gen reuses the cached layer) to retry Debian mirror
      # hiccups and show apt's real error output if it fails.
      - name: Pre-build pi-gen container
        if: ${{ matrix.pi-gen-version == 'master' }}
        run: |
          # The i386 build container has failed with "Temporary failure resolving
          # 'deb.debian.org'", so give Docker explicit DNS servers.
          echo '{"dns": ["8.8.8.8", "1.1.1.1"]}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker
          for p in linux/amd64 linux/386; do
            echo "DNS check ($p):"
            docker run --rm --platform $p docker.io/debian:trixie getent hosts deb.debian.org || echo "  DNS FAILED on $p"
          done
          git clone --depth 1 https://github.com/RPi-Distro/pi-gen.git /tmp/pi-gen-prebuild
          for i in 1 2 3; do
            docker build --progress=plain --platform linux/386 \
              --build-arg BASE_IMAGE=docker.io/i386/debian:trixie \
              -t pi-gen /tmp/pi-gen-prebuild && exit 0
            echo "docker build attempt $i failed; retrying in 60 s"; sleep 60
          done
          exit 1

      - uses: actions/checkout@v4

      - name: Put this checkout into the image stage
        run: |
          rsync -a --exclude image/stage-tiltpi/00-tiltpi/files ./ image/stage-tiltpi/00-tiltpi/files/TILTpi-v3/
          git -C image/stage-tiltpi/00-tiltpi/files/TILTpi-v3 remote set-url origin https://github.com/${{ github.repository }}.git

      - uses: usimd/pi-gen-action@v1
        id: build
        with:
          image-name: ${{ matrix.name }}
          pi-gen-version: ${{ matrix.pi-gen-version }}
          release: trixie
          stage-list: ${{ matrix.stage-list }}
          hostname: tiltpi
          username: pi
          password: ${{ secrets.IMAGE_PI_PASSWORD || 'tilt' }}
          disable-first-boot-user-rename: 1
          enable-ssh: 1
          locale: en_GB.UTF-8
          timezone: America/Los_Angeles
          wpa-country: US
          # Compressed below, after the boot partition has been checked.
          compression: none
          # The action's own cleanup purges a fixed package list that breaks when the runner
          # image changes; we free space in the step above instead.
          increase-runner-disk-size: false
          verbose-output: true

      # Windows/macOS refuse to auto-mount a FAT volume flagged dirty or damaged ("Full Repair
      # Needed"), which hides the bootfs drive users need for SETUP files. Check and repair it,
      # clear the dirty flag, then compress.
      - name: Check boot partition and compress
        id: finish
        run: |
          IMG="${{ steps.build.outputs.image-path }}"
          ls -la "$IMG"
          sudo apt-get update -qq && sudo apt-get install -y -qq dosfstools xz-utils fdisk >/dev/null
          sudo fdisk -l "$IMG"
          # Loop-mount just the first (FAT boot) partition by its offset: no dependence on the
          # runner creating /dev/loopNp1 partition nodes.
          read -r START SECTORS < <(sudo sfdisk -d "$IMG" | awk -F'[=,]' '/start=/{print $2+0, $4+0; exit}')
          LOOP=$(sudo losetup --show -f -o $((START * 512)) --sizelimit $((SECTORS * 512)) "$IMG")
          echo "--- fsck.vfat (check only) ---"
          sudo fsck.vfat -n -v "$LOOP" || true
          echo "--- fsck.vfat (repair) ---"
          sudo fsck.vfat -a -w -V "$LOOP" || true
          echo "--- fsck.vfat (after) ---"
          sudo fsck.vfat -n "$LOOP" || echo "::warning::boot partition still reports problems (see above)"
          sudo losetup -d "$LOOP"
          sudo xz -T0 -6 "$IMG"
          sudo chown "$(id -u):$(id -g)" "$IMG.xz"
          echo "image=$IMG.xz" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: ${{ matrix.name }}
          path: ${{ steps.finish.outputs.image }}
          compression-level: 0
          retention-days: 7

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ steps.finish.outputs.image }}
